name: Cross-platform build and tests

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.module }} JVM, lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [PlayerAgentApp, ControllerApp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: JVM tests, lint and debug APK
        run: bash ./gradlew :${{ matrix.module }}:testDebugUnitTest :${{ matrix.module }}:lintDebug :${{ matrix.module }}:assembleDebug --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.module }}-results
          path: |
            ${{ matrix.module }}/build/outputs/apk/debug/*.apk
            ${{ matrix.module }}/build/reports/
            ${{ matrix.module }}/build/test-results/
          if-no-files-found: warn

  android-device:
    name: Android device ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: [controller-history, controller-ui, sony-room, sony-denied, sony-granted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/ci/android_device.py '${{ matrix.group }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-${{ matrix.group }}
          path: ci-artifacts/android/${{ matrix.group }}/
          if-no-files-found: warn

  tooling:
    name: Python tooling and script tests
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [tools/ci/tests, tools/deploy/tests, tools/android-smoke-tests/tests, tools/smoke/tests]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s '${{ matrix.suite }}' -v

  ios:
    name: iOS simulator ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scheme: [sonyMusic, LyricsReadingUITests]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode
        run: xcodebuild -version
      - name: Run XCTest with narrowly classified infrastructure retry
        run: python3 tools/ci/ios_simulator.py '${{ matrix.scheme }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.scheme }}-results
          path: |
            ci-artifacts/ios/${{ matrix.scheme }}/*.log
            ci-artifacts/ios/${{ matrix.scheme }}/*.txt
            ci-artifacts/ios/${{ matrix.scheme }}/*.json
            ci-artifacts/ios/${{ matrix.scheme }}/*.png
            ci-artifacts/ios/${{ matrix.scheme }}/*.xcresult
          if-no-files-found: warn
