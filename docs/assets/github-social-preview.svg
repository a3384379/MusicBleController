      <text x="119" y="356" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Synced lyrics</text>
      <text x="119" y="383" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">word-level timing</text>
      <line x1="35" y1="416" x2="203" y2="416" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <circle cx="112" cy="445" r="17" fill="#f8fafc"/>
