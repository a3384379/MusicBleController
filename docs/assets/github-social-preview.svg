    <text x="84" y="300" fill="#cbd5e1" font-size="27" font-weight="500">Real-time QQ Music bridge over Bluetooth Low Energy</text>

    <g transform="translate(84 350)" fill="#e2e8f0" font-size="18" font-weight="600">
