      <path d="M45 18 V48.5 C45 57 35 62 28 58 C20 53 23 43 31 41 C34 40 38 40 41 41 V25 L58 21 V44.5 C58 53 48 58 41 54 C34 50 35 42 41 39 C45 37 50 38 54 39 V16 Z" fill="#fff"/>
