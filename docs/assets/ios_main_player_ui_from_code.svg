<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
  <rect width="980" height="720" fill="#f4f6f8"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#111827">iOS 主播放器 UI 结构图（由 ContentView.swift 生成）</text>
  <text x="490" y="74" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#667085">日常模式保留核心播放器；调试模式通过菜单进入诊断、健康总览与 Debug Tools</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20352d"/>
      <stop offset="0.48" stop-color="#111216"/>
      <stop offset="1" stop-color="#2b1616"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(318 104)">
    <rect x="0" y="0" width="344" height="586" rx="36" fill="#0b0d11" filter="url(#shadow)"/>
    <rect x="16" y="16" width="312" height="554" rx="30" fill="url(#bg)"/>

    <g font-family="Arial, 'PingFang SC', sans-serif">
      <rect x="34" y="42" width="128" height="44" rx="22" fill="#ffffff" opacity="0.14"/>
      <circle cx="58" cy="64" r="6" fill="#28d36b"/>
      <text x="76" y="70" font-size="15" fill="#f8fafc">Sony 已连接</text>
      <circle cx="282" cy="64" r="24" fill="#ffffff" opacity="0.13"/>
      <text x="282" y="70" text-anchor="middle" font-size="22" fill="#fff">•••</text>

      <rect x="92" y="122" width="160" height="160" rx="28" fill="#d7dfdf"/>
      <rect x="110" y="140" width="124" height="124" rx="20" fill="#1e293b"/>
      <path d="M126 232 C158 188 198 204 220 158" stroke="#f8fafc" stroke-width="4" fill="none" opacity="0.75"/>
      <text x="172" y="310" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">歌曲标题</text>
      <text x="172" y="338" text-anchor="middle" font-size="16" fill="#cbd5e1">歌手 / 专辑</text>
      <rect x="128" y="354" width="88" height="28" rx="14" fill="#ffffff" opacity="0.13"/>
      <text x="172" y="374" text-anchor="middle" font-size="13" fill="#e5e7eb">播放状态</text>

      <text x="172" y="420" text-anchor="middle" font-size="14" fill="#cbd5e1">当前歌词</text>
      <text x="172" y="452" text-anchor="middle" font-size="24" font-weight="700" fill="#f8fafc">三行歌词 / 暂无歌词</text>
      <text x="172" y="482" text-anchor="middle" font-size="14" fill="#cbd5e1">可打开全屏歌词</text>

      <line x1="36" y1="516" x2="308" y2="516" stroke="#ffffff" stroke-width="5" opacity="0.22" stroke-linecap="round"/>
      <line x1="36" y1="516" x2="112" y2="516" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="112" cy="516" r="14" fill="#fff"/>
      <text x="36" y="546" font-size="12" fill="#e5e7eb">00:57</text>
      <text x="276" y="546" font-size="12" fill="#e5e7eb">04:53</text>

      <rect x="34" y="558" width="276" height="42" rx="21" fill="#ffffff" opacity="0.12"/>
      <text x="58" y="584" font-size="18" fill="#fff">♪</text>
      <line x1="88" y1="579" x2="248" y2="579" stroke="#ffffff" stroke-width="4" opacity="0.26" stroke-linecap="round"/>
      <line x1="88" y1="579" x2="178" y2="579" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="178" cy="579" r="12" fill="#fff"/>
      <text x="266" y="584" font-size="12" fill="#fff">16 / 31</text>
    </g>
  </g>

  <g transform="translate(36 150)" font-family="Arial, 'PingFang SC', sans-serif">
    <text x="0" y="0" font-size="21" font-weight="700" fill="#1f2937">页面结构</text>
    <text x="0" y="38" font-size="16" fill="#374151">1. 背景：当前封面模糊铺底</text>
    <text x="0" y="70" font-size="16" fill="#374151">2. 顶部：连接胶囊 + 菜单</text>
    <text x="0" y="102" font-size="16" fill="#374151">3. 主体：封面 / 歌曲 / 歌词</text>
    <text x="0" y="134" font-size="16" fill="#374151">4. 控制：进度、音量、播放</text>
    <text x="0" y="166" font-size="16" fill="#374151">5. 调试入口仅 Debug 模式显示</text>
  </g>

  <g transform="translate(710 150)" font-family="Arial, 'PingFang SC', sans-serif">
    <text x="0" y="0" font-size="21" font-weight="700" fill="#1f2937">右上菜单</text>
    <rect x="0" y="22" width="220" height="238" rx="14" fill="#ffffff" stroke="#d0d5dd"/>
    <text x="18" y="58" font-size="16" fill="#111827">扫描 / 重连</text>
    <text x="18" y="94" font-size="16" fill="#111827">设置</text>
    <text x="18" y="130" font-size="16" fill="#111827">进入 / 退出调试模式</text>
    <line x1="18" y1="154" x2="202" y2="154" stroke="#e5e7eb"/>
    <text x="18" y="188" font-size="15" fill="#475467">Debug 模式：</text>
    <text x="18" y="220" font-size="15" fill="#475467">当前歌曲诊断</text>
    <text x="18" y="248" font-size="15" fill="#475467">系统健康总览</text>
  </g>

  <g transform="translate(710 454)" font-family="Arial, 'PingFang SC', sans-serif">
    <text x="0" y="0" font-size="21" font-weight="700" fill="#1f2937">状态来源</text>
    <rect x="0" y="24" width="220" height="118" rx="14" fill="#eef6ff" stroke="#bfdbfe"/>
    <text x="18" y="60" font-size="15" fill="#1e3a8a">BLE status notify</text>
    <text x="18" y="88" font-size="15" fill="#1e3a8a">本地进度预测</text>
    <text x="18" y="116" font-size="15" fill="#1e3a8a">AlbumArtReceiver 缓存</text>
  </g>
</svg>
